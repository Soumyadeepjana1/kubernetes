apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deploy
  namespace: tws

spec:
  replicas: 5
  selector:
    matchLabels:
      app: redis

  template:
    metadata:
      labels:
        app: redis

    spec:
      containers:
        - name: redis
          image: redis:latest
          ports:
            - containerPort: 6379
